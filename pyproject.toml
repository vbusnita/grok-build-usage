[project]
name = "grok-build-usage"
version = "0.1.0"
description = "macOS menu bar + floating HUD for Grok Build credit usage (your account pool)."
authors = [{ name = "Victor Busnita" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["grok", "xai", "macos", "menu-bar", "usage", "billing", "hud"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "rumps>=0.4.0",
    "pyobjc-framework-Cocoa>=10.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Full macOS runtime (install-app.sh / local menu bar). Not required for unit tests.
macos = [
    "rumps>=0.4.0",
    "pyobjc-framework-Cocoa>=10.0",
]

[project.urls]
Homepage = "https://github.com/vbusnita/grok-build-usage"
Repository = "https://github.com/vbusnita/grok-build-usage"
Issues = "https://github.com/vbusnita/grok-build-usage/issues"

[project.scripts]
gbu = "gbu.__main__:main"
grok-build-usage = "gbu.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gbu = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
